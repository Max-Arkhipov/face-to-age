name: efficientnet_b0_cemv_pt_78
checkpoint_name: efficientnet_b0_cemv_pt_78.pth
backbone: efficientnet_b0
pretrained: true
freeze_backbone: true
head: classification
num_classes: 117

loss:
  name: ce_mv
  lambda_mean: 0.2
  lambda_var: 0.05

optimizer:
  name: adamw
  lr: 5e-4
  weight_decay: 1e-4

finetune:
  enabled: true
  unfreeze_epoch: 2
  backbone_lr: 1e-5
  unfreeze_layers: ["features.8", "features.7"]
